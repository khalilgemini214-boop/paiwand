name: Make signing key

# Run this once from the Actions tab, then copy the four secrets into
# Settings -> Secrets and variables -> Actions so in-app updates keep working.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore paiwand.jks \
            -alias paiwand \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass paiwand-dev-2026 \
            -keypass paiwand-dev-2026 \
            -dname "CN=Paiwand, O=Paiwand, C=PK"
          base64 -w0 paiwand.jks > keystore.b64
          echo "Keystore generated. Password and key password: paiwand-dev-2026"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: paiwand-keystore
          path: keystore.b64
