name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compute version
        id: version
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building $NAME ($CODE)"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/paiwand.jks
            echo "SIGNING=1" >> "$GITHUB_ENV"
            echo "Signing with the release keystore"
          else
            echo "::warning::No KEYSTORE_BASE64 secret. This build uses a throwaway debug key, so in-app updates will fall back to a manual download."
          fi

      - name: Build APK
        run: |
          REPO="${{ github.repository }}"
          ARGS="-PappVersionCode=${{ steps.version.outputs.code }}"
          ARGS="$ARGS -PappVersionName=${{ steps.version.outputs.name }}"
          ARGS="$ARGS -PupdateUrl=https://github.com/$REPO/releases/latest/download/update.json"
          ARGS="$ARGS -PdownloadUrl=https://github.com/$REPO/releases/latest/download/paiwand.apk"
          ARGS="$ARGS -PreleasePage=https://github.com/$REPO/releases/latest"
          if [ -n "$SIGNING" ]; then
            ARGS="$ARGS -PciKeystore=paiwand.jks"
            ARGS="$ARGS -PciKeystorePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            ARGS="$ARGS -PciKeyAlias=${{ secrets.KEY_ALIAS }}"
            ARGS="$ARGS -PciKeyPassword=${{ secrets.KEY_PASSWORD }}"
          fi
          gradle assembleDebug $ARGS

      - name: Package artifacts
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/paiwand.apk
          SIZE=$(stat -c%s out/paiwand.apk)
          SHA=$(sha256sum out/paiwand.apk | cut -d' ' -f1)
          jq -n \
            --argjson code "${{ steps.version.outputs.code }}" \
            --arg name "${{ steps.version.outputs.name }}" \
            --arg apk "https://github.com/${{ github.repository }}/releases/latest/download/paiwand.apk" \
            --arg page "https://github.com/${{ github.repository }}/releases/latest" \
            --argjson size "$SIZE" \
            --arg sha "$SHA" \
            --arg log "$COMMIT_MSG" \
            '{versionCode: $code, versionName: $name, apkUrl: $apk, releasePage: $page, sizeBytes: $size, sha256: $sha, mandatory: false, requiresReinstall: false, changelog: (($log | split("\n")) | map(select(length > 0)) | .[0:5])}' > out/update.json
          cat out/update.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: paiwand-apk
          path: out/paiwand.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Paiwand v${{ steps.version.outputs.name }}
          body: |
            Built automatically from `${{ github.sha }}`.
          files: |
            out/paiwand.apk
            out/update.json
          make_latest: true
          fail_on_unmatched_files: true
